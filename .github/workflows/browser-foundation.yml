name: Browser encryption foundation

on:
  push:
    branches: [gajim-browser-foundation, develop]
    paths: ['browser/**', '.github/workflows/browser-foundation.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Install pinned build tools
        run: |
          python -m venv browser/.venv
          browser/.venv/bin/python -m pip install -r browser/requirements-build.txt
      - name: Build unchanged upstream encryption for WebAssembly
        run: browser/.venv/bin/python browser/scripts/build.py
      - name: Install pinned storage test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix browser
      - name: Exercise storage failures and concurrent access
        run: npm test --prefix browser
      - name: Run upstream and negative tests in WebAssembly
        run: node browser/scripts/test-wasm.mjs
      - name: Verify adapted nbxmpp protocol and browser-loop behavior
        run: node browser/scripts/test-protocol-wasm.mjs
      - name: Reject altered test artifacts
        run: python browser/scripts/test-integrity.py
      - name: Compiler diagnostics on failure
        if: failure()
        run: test ! -f browser/.build/compiler.log || tail -150 browser/.build/compiler.log
