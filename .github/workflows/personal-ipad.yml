name: Build personal iPad app

on:
  pull_request:
    branches: [develop]
    paths:
      - 'Monal/**'
      - 'rust/**'
      - 'scripts/*personal-build*'
      - '.github/workflows/personal-ipad.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  personal_ipad:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
      - name: Select Xcode
        run: sudo xcode-select -s '/Applications/Xcode_26.2.app/Contents/Developer'
      - name: Install coreutils
        run: brew install coreutils
      - name: Build Rust bridge
        run: bash rust/build-rust.sh
      - name: Install CocoaPods dependencies
        working-directory: Monal
        run: pod install --repo-update
      - name: Prepare the personal build
        env:
          PERSONAL_BUILD_NUMBER: ${{ github.run_number }}
        run: ruby scripts/prepare-personal-build.rb
      - name: Choose an iPad simulator
        run: |
          mkdir -p "$RUNNER_TEMP/personal-diagnostics"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path(os.environ['RUNNER_TEMP'], 'simulators.json').read_text())['devices']
          runtimes = sorted((key for key in devices if '.iOS-' in key),
              key=lambda key: tuple(map(int, key.split('.iOS-')[1].split('-'))), reverse=True)
          ipad = next(device for runtime in runtimes for device in devices[runtime] if device['name'].startswith('iPad'))
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f"IPAD_SIMULATOR_ID={ipad['udid']}\n")
          print(f"Testing on {ipad['name']} ({ipad['udid']})")
          PY
      - name: Test personal storage, startup, and message selection
        working-directory: Monal
        run: |
          set -o pipefail
          NSUnbufferedIO=YES xcodebuild test \
            -workspace Monal.xcworkspace -scheme Monal \
            -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/personal-diagnostics/Tests.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/personal-diagnostics/tests.log"
      - name: Archive for a physical iPad
        working-directory: Monal
        run: |
          set -o pipefail
          NSUnbufferedIO=YES xcodebuild archive \
            -workspace Monal.xcworkspace -scheme Monal -configuration AppStore \
            -destination 'generic/platform=iOS' -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Monal-Personal.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            2>&1 | tee "$RUNNER_TEMP/personal-diagnostics/archive.log"
      - name: Package and validate the device app
        run: |
          python3 scripts/package-personal-build.py \
            "$RUNNER_TEMP/Monal-Personal.xcarchive" "$RUNNER_TEMP/personal-app"
          cp docs/PERSONAL-IPAD-INSTALL.md "$RUNNER_TEMP/personal-app/INSTALL.md"
      - name: Upload the personal app
        uses: actions/upload-artifact@v7
        with:
          name: Monal-Modified-iPad
          path: ${{ runner.temp }}/personal-app
          if-no-files-found: error
          retention-days: 30
      - name: Export test summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ -d "$RUNNER_TEMP/personal-diagnostics/Tests.xcresult" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/personal-diagnostics/Tests.xcresult" \
              > "$RUNNER_TEMP/personal-diagnostics/summary.json"
          fi
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: personal-ipad-diagnostics
          path: ${{ runner.temp }}/personal-diagnostics
          if-no-files-found: ignore
          retention-days: 14
