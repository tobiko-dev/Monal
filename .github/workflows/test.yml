name: Run automated tests

on:
  pull_request:
    branches:
      - develop
      - beta
      - stable
      - quicksy
  push:
    branches:
      - develop
  workflow_dispatch:

permissions: {}

jobs:
  run_tests:
    runs-on: macos-15
    name: Run automated tests
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
          submodules: true
          fetch-depth: 1000
          fetch-tags: true
          show-progress: true
          lfs: true
      - name: Checkout submodules
        run: git submodule update -f --init --remote
      - name: Select Xcode version
        run: sudo xcode-select -s '/Applications/Xcode_26.2.app/Contents/Developer'
      - name: Install coreutils
        run: brew install coreutils
      - name: Build rust
        run: bash ./rust/build-rust.sh
      - name: Install pods
        working-directory: Monal
        run: pod install --repo-update
      - name: Choose an available iPad simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          devices = json.loads(Path(os.environ["RUNNER_TEMP"], "simulators.json").read_text())["devices"]
          runtimes = sorted(
              (runtime for runtime in devices if ".iOS-" in runtime),
              key=lambda runtime: tuple(map(int, runtime.split(".iOS-")[1].split("-"))),
              reverse=True,
          )
          ipad = next(device for runtime in runtimes for device in devices[runtime]
                      if device["name"].startswith("iPad"))
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"IPAD_SIMULATOR_ID={ipad['udid']}\n")
          print(f"Testing on {ipad['name']} ({ipad['udid']})")
          PY
      - name: Run tests
        working-directory: Monal
        run: |
          mkdir -p "$RUNNER_TEMP/test-artifacts"
          set -o pipefail && \
          NSUnbufferedIO=YES xcodebuild \
            -workspace Monal.xcworkspace \
            -scheme Monal \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/test-artifacts/TestResults.xcresult" \
            test \
            2>&1 | \
          tee "$RUNNER_TEMP/test-artifacts/xcodebuild.log" | \
          stdbuf -oL -eL xcbeautify --renderer github-actions | \
          while IFS= read -r line; do \
            echo "$line"; \
            if [[ "$line" =~ "✔" ]]; then \
              echo "::notice ::${line}"; \
            fi; \
          done
      - name: Collect crash reports
        if: ${{ !cancelled() }}
        run: |
          if [ -d ~/Library/Logs/DiagnosticReports ]; then
            cp -R ~/Library/Logs/DiagnosticReports "$RUNNER_TEMP/test-artifacts/" || true
          fi
      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore
          retention-days: 14
